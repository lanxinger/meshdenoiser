name: Build Multi-Platform Binaries

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

# Read-only by default; only the release job below can write.
permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meshdenoiser-linux
            build_type: Release
          - os: macos-latest
            artifact_name: meshdenoiser-macos
            build_type: Release
          - os: windows-latest
            artifact_name: meshdenoiser-windows
            build_type: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # CMake and the C/C++ toolchains are preinstalled on GitHub-hosted runners.
      # MESHDENOISER_NATIVE_ARCH stays off so the binaries run on any CPU of the target arch.
      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} -j

      - name: Verify CLI golden parity and import fixtures
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Prepare artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp build/MeshDenoiser artifacts/
          cp MeshDenoiserDefaults.txt README.md artifacts/
          cp -R LICENSES artifacts/
          chmod +x artifacts/MeshDenoiser

          # OpenMesh is linked statically; fail if the binary still needs its shared libraries.
          if [ "$RUNNER_OS" == "macOS" ]; then
            linked_libraries=$(otool -L artifacts/MeshDenoiser)
          else
            linked_libraries=$(ldd artifacts/MeshDenoiser)
          fi
          if echo "$linked_libraries" | grep -i openmesh; then
            echo "MeshDenoiser must not depend on OpenMesh shared libraries" >&2
            exit 1
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            codesign --force --sign - artifacts/MeshDenoiser
          fi

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          Get-ChildItem -Path build -Recurse -Filter MeshDenoiser.exe | ForEach-Object { Copy-Item $_.FullName -Destination artifacts\ }
          copy MeshDenoiserDefaults.txt artifacts\
          copy README.md artifacts\
          Copy-Item LICENSES -Destination artifacts\LICENSES -Recurse

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
          retention-days: 30

  release:
    name: Attach binaries to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create release archives
        run: |
          # Artifact uploads do not keep file modes, so restore the executable bit first.
          for name in meshdenoiser-linux meshdenoiser-macos; do
            chmod +x "dist/$name/MeshDenoiser"
            (cd "dist/$name" && tar -czf "../../$name.tar.gz" *)
          done
          (cd dist/meshdenoiser-windows && zip -r ../../meshdenoiser-windows.zip .)

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            meshdenoiser-linux.tar.gz
            meshdenoiser-macos.tar.gz
            meshdenoiser-windows.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  swift-package:
    name: Swift Package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run package tests
        run: swift test
